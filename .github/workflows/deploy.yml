name: 🚀 100% Automated Deploy to cPanel

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Sync & Deploy to cPanel Live Server
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 📂 Sync files to cPanel public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: loose
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            cloudflared.exe
            *.log
            *.err
            *.zip
            *.bat
            *.ps1
            package-cpanel.js
            fix_*.js
            update_*.js
            generate_docs.js
